name: Validate SAGSCXR-RNS (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static application
        run: |
          set -e
          node --check app.js
          node --check library.js
          node --check manager.js
          node --check readsign.js
          test -s index.html
          test -s secure.html
          test -s manage.html
          test -s read-sign.html
          test -s app.css
